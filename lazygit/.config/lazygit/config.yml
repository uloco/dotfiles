os:
  # The preset only suspends lazygit for the editor when it runs outside Neovim ($NVIM unset)
  editPreset: "nvim-remote"
  # Same as the preset, but opens files in the current window (--remote) instead of a new tab
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (nvim --server "$NVIM" --remote-send "q" && nvim --server "$NVIM" --remote {{dir}})'
gui:
  showFileTree: false
  scrollHeight: 20
  showIcons: true
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - magenta
      - bold
    inactiveBorderColor:
      - default
    selectedLineBgColor:
      - reverse
    cherryPickedCommitBgColor:
      - reverse
    cherryPickedCommitFgColor:
      - magenta
    authorColors:
      "Umut Topuzoğlu": "magenta"
    branchColorPatterns:
      "^main(/|$)": "blue"
      "^master(/|$)": "blue"
      "^dev(/|$)": "green"
      "^develop(/|$)": "green"
      "^release(/|$)": "yellow"
      "^hotfix(/|$)": "red"
  darkTheme:
    inactiveViewSelectedLineBgColor:
      - "black"
  lightTheme:
    inactiveViewSelectedLineBgColor:
      - "white"
promptToReturnFromSubprocess: false
keybinding:
  universal:
    createRebaseOptionsMenu: "M"
  branches:
    mergeIntoCurrentBranch: "m"
  files:
    openMergeOptions: "T"
git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --features {{colorScheme}}-mode"
  skipHookPrefix: "wip:"
customCommands:
  - key: "<c-f>"
    context: "localBranches"
    command: 'git fetch && git checkout "$(pbpaste)"'
    description: "Feature: Fetch branches and create new from clipboard"
    loadingText: "Creating branch"
