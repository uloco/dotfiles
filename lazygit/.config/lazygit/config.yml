os:
  # The preset only suspends lazygit for the editor when it runs outside Neovim ($NVIM unset)
  editPreset: "nvim-remote"
  # Inside Neovim: leave terminal mode, hide (not quit) the lazygit float via Snacks, then open the file
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (f={{filename}}; nvim --server "$NVIM" --remote-send "<C-\><C-n>:lua Snacks.lazygit()<CR>:edit $f<CR>")'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (f={{filename}}; nvim --server "$NVIM" --remote-send "<C-\><C-n>:lua Snacks.lazygit()<CR>:edit +{{line}} $f<CR>")'
  openDirInEditor: '[ -z "$NVIM" ] && (nvim -- {{dir}}) || (d={{dir}}; nvim --server "$NVIM" --remote-send "<C-\><C-n>:lua Snacks.lazygit()<CR>:edit $d<CR>")'
gui:
  showFileTree: false
  scrollHeight: 20
  showIcons: true
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - magenta
      - bold
    inactiveBorderColor:
      - default
    selectedLineBgColor:
      - reverse
    cherryPickedCommitBgColor:
      - reverse
    cherryPickedCommitFgColor:
      - magenta
    authorColors:
      "Umut Topuzoğlu": "magenta"
    branchColorPatterns:
      "^main(/|$)": "blue"
      "^master(/|$)": "blue"
      "^dev(/|$)": "green"
      "^develop(/|$)": "green"
      "^release(/|$)": "yellow"
      "^hotfix(/|$)": "red"
  darkTheme:
    inactiveViewSelectedLineBgColor:
      - "black"
  lightTheme:
    inactiveViewSelectedLineBgColor:
      - "white"
promptToReturnFromSubprocess: false
keybinding:
  universal:
    createRebaseOptionsMenu: "M"
  branches:
    mergeIntoCurrentBranch: "m"
  files:
    openMergeOptions: "T"
git:
  mainBranches: [master, main, develop]
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --features {{colorScheme}}-mode"
  skipHookPrefix: "wip:"
customCommands:
  - key: "<c-f>"
    context: "localBranches"
    command: 'git fetch && git checkout "$(pbpaste)"'
    description: "Feature: Fetch branches and create new from clipboard"
    loadingText: "Creating branch"
