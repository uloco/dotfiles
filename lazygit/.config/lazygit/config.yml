os:
  editPreset: "nvim-remote"
gui:
  showFileTree: false
  scrollHeight: 20
  showIcons: true
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - magenta
      - bold
    inactiveBorderColor:
      - default
    selectedLineBgColor:
      - reverse
    cherryPickedCommitBgColor:
      - reverse
    cherryPickedCommitFgColor:
      - magenta
    authorColors:
      "Umut Topuzoğlu": "magenta"
    branchColorPatterns:
      "^main(/|$)": "blue"
      "^master(/|$)": "blue"
      "^dev(/|$)": "green"
      "^develop(/|$)": "green"
      "^release(/|$)": "yellow"
      "^hotfix(/|$)": "red"
  darkTheme:
    inactiveViewSelectedLineBgColor:
      - "#636D83" # bluloco comment
  lightTheme:
    inactiveViewSelectedLineBgColor:
      - "#A0A1A7" # bluloco comment
promptToReturnFromSubprocess: false
keybinding:
  universal:
    createRebaseOptionsMenu: "M"
  branches:
    mergeIntoCurrentBranch: "m"
  files:
    openMergeOptions: "T"
git:
  overrideGpg: true
  diffRenderers:
    - colorArg: always
      command: "delta --paging=never --features {{colorScheme}}-mode"
  skipHookPrefix: "wip:"
customCommands:
  - key: "<c-f>"
    context: "localBranches"
    command: 'git fetch && git checkout "$(pbpaste)"'
    description: "Feature: Fetch branches and create new from clipboard"
    loadingText: "Creating branch"
