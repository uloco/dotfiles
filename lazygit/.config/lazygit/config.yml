os:
  editPreset: "nvim-remote"
gui:
  showFileTree: false
  scrollHeight: 20
  showIcons: true
  nerdFontsVersion: "3"
  theme:
    authorColors:
      "Umut Topuzoğlu": "magenta"
    branchColorPatterns:
      "^main(/|$)": "blue"
      "^master(/|$)": "blue"
      "^dev(/|$)": "green"
      "^develop(/|$)": "green"
      "^release(/|$)": "yellow"
      "^hotfix(/|$)": "red"
promptToReturnFromSubprocess: false
keybinding:
  universal:
    createRebaseOptionsMenu: "M"
  branches:
    mergeIntoCurrentBranch: "m"
  files:
    openMergeOptions: "T"
git:
  overrideGpg: true
  skipHookPrefix: "wip:"
customCommands:
  - key: "<c-f>"
    context: "localBranches"
    command: 'git fetch && git checkout "$(pbpaste)"'
    description: "Feature: Fetch branches and create new from clipboard"
    loadingText: "Creating branch"
